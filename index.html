<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Семён AI</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Семён AI">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="https://i.ibb.co/Dfq5tw7J/IMG-6056.jpg">
<link rel="icon" href="https://i.ibb.co/Dfq5tw7J/IMG-6056.jpg">
<link rel="manifest" id="mf">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 4px}
.burger{width:44px;height:44px;border:0;background:none;position:relative;cursor:pointer}
.burger i{position:absolute;left:10px;top:13px;width:24px;height:3px;background:#fff;border-radius:2px;box-shadow:0 8px 0 #fff,0 16px 0 #fff}
.main{flex:1;position:relative;min-height:0}
#chat{position:absolute;inset:0;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.u,.a{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.45;font-size:16px}
.u{align-self:flex-end;max-width:85%;background:#262626;padding:10px 14px;border-radius:18px 18px 4px 18px}
.a{align-self:flex-start;max-width:94%}
pre{background:#161616;padding:10px;border-radius:10px;overflow-x:auto;white-space:pre;margin:8px 0;font-size:13px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#1d1d1d;border-radius:5px;padding:1px 4px}
pre code{background:none;padding:0}
.ld{align-self:flex-start;font-size:30px;transition:opacity .6s}
.ld span{display:inline-block;animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#hello{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;pointer-events:none;font-size:30px;font-weight:800;overflow-wrap:anywhere}
#hello span{background:linear-gradient(90deg,#f33,#fa0,#ee0,#3d3,#0cf,#66f,#f3f,#f33);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rb 4s linear infinite}
@keyframes rb{to{background-position:300% 0}}
.bar{display:flex;gap:10px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar input{flex:1;min-width:0;height:48px;border:0;border-radius:24px;background:#ff2d2d;color:#000;padding:0 18px;font-size:16px;outline:0;text-overflow:ellipsis;white-space:nowrap}
.bar input::placeholder{color:#000;opacity:1}
.send{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:#ff2d2d;position:relative;cursor:pointer}
.send::before{content:"";position:absolute;left:50%;top:13px;width:3px;height:21px;margin-left:-1.5px;background:#000;border-radius:2px}
.send::after{content:"";position:absolute;left:50%;top:15px;width:12px;height:12px;margin-left:-6px;border-left:3px solid #000;border-top:3px solid #000;transform:rotate(45deg)}
#menu{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
#menu.on{transform:none;visibility:visible}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
.x{width:44px;height:44px;border-radius:50%;background:#ff2d2d;color:#000;border:0;font:700 22px/1 sans-serif;cursor:pointer}
.nc{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;font-size:17px;font-weight:600;padding:8px 4px;cursor:pointer}
.pad{width:18px;height:22px;border:2px solid #fff;border-radius:3px;position:relative;background:repeating-linear-gradient(#000 0 4px,#fff 4px 5px);background-size:100% 100%;background-position:0 5px;background-repeat:no-repeat}
.pad::before{content:"";position:absolute;left:2px;right:2px;top:-5px;height:5px;border-left:2px solid #fff;border-right:2px solid #fff}
.list{flex:1;overflow-y:auto;padding:6px 14px}
.it{padding:13px 14px;border-radius:12px;background:#151515;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.it.cur{outline:1px solid #ff2d2d}
.bot{padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center}
#reg{background:#1e6bff;color:#fff;border:0;border-radius:14px;padding:15px 28px;font-size:17px;font-weight:700;cursor:pointer}
#nick{display:none;align-items:center;gap:10px;font-size:18px;font-weight:600;overflow-wrap:anywhere}
#nick b{width:36px;height:36px;border-radius:50%;background:#1e6bff;display:grid;place-items:center;flex:none}
#md{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none;place-items:center}
.box{position:relative;width:min(86vw,320px);aspect-ratio:1;background:#1c1c1c;border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.box h3{margin:6px 34px 0;text-align:center;font-size:18px;color:#fff}
.box input{width:100%;height:46px;border-radius:12px;border:1px solid #444;background:#000;color:#fff;font-size:16px;text-align:center;outline:0}
.cl{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:#333;color:#fff;font:400 20px/1 sans-serif;cursor:pointer}
.go{width:100%;height:46px;border:0;border-radius:12px;background:#ff9500;color:#000;font-size:17px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header><button class="burger" id="bg" aria-label="Меню"><i></i></button></header>
  <div class="main">
    <div id="chat"></div>
    <div id="hello"><span id="hs"></span></div>
  </div>
  <div class="bar">
    <input id="in" placeholder="Спросите Семёна" autocomplete="off" enterkeyhint="send">
    <button class="send" id="sd" aria-label="Отправить"></button>
  </div>
</div>

<div id="menu">
  <div class="top">
    <button class="nc" id="nc"><span class="pad"></span>Новый чат</button>
    <button class="x" id="mx">Х</button>
  </div>
  <div class="list" id="list"></div>
  <div class="bot">
    <button id="reg">Создать аккаунт</button>
    <div id="nick"><b id="av"></b><span id="nm"></span></div>
  </div>
</div>

<div id="md">
  <div class="box">
    <button class="cl" id="mc" aria-label="Закрыть">×</button>
    <h3>Создайте аккаунт с Ника</h3>
    <input id="ni" maxlength="20" placeholder="Ник" autocomplete="off">
    <button class="go" id="go">Регистрация</button>
  </div>
</div>

<script type="module">
try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const {getDatabase,ref,set,get}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
  const app=initializeApp({
    apiKey:"AIzaSyDl3VlCb-xuUNoBpa5vwYKPUFwFQFm5G2c",
    authDomain:"semyonai-29c1b.firebaseapp.com",
    databaseURL:"https://semyonai-29c1b-default-rtdb.firebaseio.com",
    projectId:"semyonai-29c1b",
    storageBucket:"semyonai-29c1b.firebasestorage.app",
    messagingSenderId:"481548783017",
    appId:"1:481548783017:web:d16c322a9e0de1eb39c8b8"
  });
  const db=getDatabase(app);
  window.FB={save:(n,d)=>set(ref(db,'users/'+n),d),load:n=>get(ref(db,'users/'+n)).then(s=>s.val())};
}catch(e){console.warn('Firebase off',e)}
window.dispatchEvent(new Event('fb'));
</script>

<script>
const $=s=>document.querySelector(s);
const ICON='https://i.ibb.co/Dfq5tw7J/IMG-6056.jpg';
// Ключ разделён на 3 части, склеивается браузером в момент запроса
const k1='AQ.Ab8RN6LGJNLOy72C',k2='TIkT-kF_Eu1Hwq1Q_e',k3='XQpIkUQ0OA1vKmNg';
const SYS='Ты Семён AI — помогаешь с кодом, делами, лайфхаками, учёбой и всем остальным. Внимательно читай вопрос пользователя и отвечай именно на него, по делу, на языке пользователя. Помни контекст переписки.';

let chats={},cur=null,nick=localStorage.sai_nick||'',busy=false,tm;
try{chats=JSON.parse(localStorage.sai_chats||'{}')}catch(e){}
const chat=$('#chat');

/* PWA manifest */
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify({name:'Семён AI',short_name:'Семён AI',start_url:'.',display:'standalone',background_color:'#000000',theme_color:'#000000',icons:[{src:ICON,sizes:'512x512',type:'image/jpeg'}]})],{type:'application/manifest+json'}));

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
  s=esc(s);
  s=s.replace(/```\w*\n?([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c+'</code></pre>');
  return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
}
const scroll=()=>{chat.scrollTop=chat.scrollHeight};

/* ---------- облако ---------- */
const fkey=()=>encodeURIComponent(nick).replace(/\./g,'%2E');
function save(){
  const data=JSON.stringify(chats);
  localStorage.sai_chats=data;
  if(nick&&window.FB)FB.save(fkey(),{data,t:Date.now()}).catch(()=>{});
}
async function sync(){
  if(!nick||!window.FB)return;
  try{
    const v=await FB.load(fkey());
    if(v&&v.data){
      const r=JSON.parse(v.data);
      for(const id in r){if(!chats[id]||(r[id].t||0)>(chats[id].t||0))chats[id]=r[id]}
      localStorage.sai_chats=JSON.stringify(chats);
      renderList();
      if(cur&&chats[cur]&&!busy)openChat(cur);
    }
    save();
  }catch(e){}
}
window.addEventListener('fb',sync);

/* ---------- интерфейс ---------- */
function showHello(){
  const empty=!cur||!chats[cur]||!chats[cur].m.length;
  $('#hello').style.display=(empty&&nick)?'grid':'none';
  $('#hs').textContent='Здравствуйте, '+nick+'!';
}
function bubble(role,text,type){
  const d=document.createElement('div');
  d.className=role==='user'?'u':'a';
  chat.appendChild(d);
  if(role==='user'){d.textContent=text;scroll();return Promise.resolve()}
  if(!type){d.innerHTML=md(text);scroll();return Promise.resolve()}
  return new Promise(res=>{
    let i=0;const st=Math.max(1,Math.ceil(text.length/350));
    clearInterval(tm);
    tm=setInterval(()=>{
      i+=st;d.textContent=text.slice(0,i);scroll();
      if(i>=text.length){clearInterval(tm);d.innerHTML=md(text);scroll();res()}
    },18);
  });
}
function loader(){
  const d=document.createElement('div');d.className='ld';d.innerHTML='<span>⚡️</span>';
  chat.appendChild(d);
  const E=['⚡️','🧢','🎮'];let n=0;
  d.t=setInterval(()=>{
    d.style.opacity=0;
    setTimeout(()=>{n=(n+1)%3;d.firstChild.textContent=E[n];d.style.opacity=1},600);
  },6000);
  scroll();return d;
}
function openChat(id){
  clearInterval(tm);cur=id;chat.innerHTML='';
  chats[id].m.forEach(m=>bubble(m.r==='user'?'user':'bot',m.t,false));
  showHello();renderList();
}
function newChat(){clearInterval(tm);cur=null;chat.innerHTML='';showHello();renderList()}
function renderList(){
  const l=$('#list');l.innerHTML='';
  Object.values(chats).sort((a,b)=>(b.t||0)-(a.t||0)).forEach(c=>{
    const d=document.createElement('div');d.className='it'+(c.id===cur?' cur':'');
    d.textContent=c.title;
    d.onclick=()=>{openChat(c.id);menu(false)};
    l.appendChild(d);
  });
}
const menu=on=>$('#menu').classList.toggle('on',on);
function showNick(){
  if(!nick){$('#reg').style.display='';$('#nick').style.display='none';return}
  $('#reg').style.display='none';$('#nick').style.display='flex';
  $('#nm').textContent=nick;$('#av').textContent=nick[0].toUpperCase();
}

/* ---------- отправка ---------- */
async function send(){
  const inp=$('#in'),text=inp.value.trim();
  if(!text||busy)return;
  inp.value='';busy=true;
  if(!cur||!chats[cur]){
    cur='c'+Date.now();
    chats[cur]={id:cur,title:text.slice(0,40),m:[],t:Date.now()};
  }
  const id=cur,c=chats[id];
  c.m.push({r:'user',t:text});c.t=Date.now();save();renderList();showHello();
  bubble('user',text);
  const ld=loader();
  const ans=await ask(c.m);
  clearInterval(ld.t);ld.remove();
  c.m.push({r:'bot',t:ans});c.t=Date.now();save();
  if(cur===id)await bubble('bot',ans,true);
  busy=false;
}

async function ask(msgs){
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent',{
      method:'POST',signal:ac.signal,
      headers:{'Content-Type':'application/json','X-goog-api-key':k1+k2+k3},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:SYS}]},
        contents:msgs.map(m=>({role:m.r==='user'?'user':'model',parts:[{text:m.t}]}))
      })
    });
    clearTimeout(to);
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const t=(j.candidates[0].content.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
    if(!t)throw new Error('empty');
    return t;
  }catch(e){return fallback(msgs)}
}

/* ---------- резервный словарь (если кончилась квота ИИ) ---------- */
const BUTTERFLY=[
'<!DOCTYPE html>','<html><head><meta charset="utf-8"><style>',
'body{margin:0;height:100vh;display:grid;place-items:center;background:#111}',
'.b{position:relative;width:200px;height:120px;animation:f 3s ease-in-out infinite alternate}',
'.w{position:absolute;top:0;width:92px;height:110px;background:radial-gradient(circle at 50% 40%,#ff0,#f0a);animation:fl .45s ease-in-out infinite alternate}',
'.l{left:4px;border-radius:90% 10% 80% 20%;transform-origin:right center}',
'.r{right:4px;border-radius:10% 90% 20% 80%;transform-origin:left center}',
'.t{position:absolute;left:96px;top:8px;width:8px;height:104px;background:#fff;border-radius:4px}',
'@keyframes fl{to{transform:scaleX(.3)}}',
'@keyframes f{to{transform:translateY(-25px)}}',
'</style></head><body>',
'<div class="b"><div class="w l"></div><div class="w r"></div><div class="t"></div></div>',
'</body></html>'].join('\n');
const F='```';
const D=[
 [/^(привет|приветик|здравствуй|здравствуйте|хай|здорово|салам|ку)\b/,()=>'Привет! 👋 Как у тебя дела?'],
 [/^(хорошо|отлично|норм|нормально|супер|прекрасно|замечательно|good)\b/,(t,p)=>/как у тебя дела/i.test(p)?'Отлично! Раз у тебя дела хорошо мы можем придумать многое! Чем займёмся?':null],
 [/^(плохо|так себе|грустно|не очень)/,(t,p)=>/как у тебя дела/i.test(p)?'Эх, держись! 🫂 Расскажи, что случилось, или давай отвлечёмся — могу показать лайфхак или сделать что-нибудь на коде.':null],
 [/бабочк/,()=>'Вот как делается html бабочка 🦋\nСоздай файл index.html и открой его на компьютере или телефоне с этим кодом ниже:\n'+F+'html\n'+BUTTERFLY+'\n'+F+'\nКрылья машут за счёт анимации scaleX в CSS.'],
 [/моя семья крутая/,()=>'Конечно же да думаю! 🙂🔥 Наверное у меня целый отряд из роботов!'],
 [/как (у тебя )?дела|как жизнь|как ты\b/,()=>'У меня всё отлично, я же заряжен на 100%! ⚡️ А у тебя как?'],
 [/кто ты|как тебя зовут|ты кто/,()=>'Я Семён AI 🧢 Помогаю с кодом, делами, лайфхаками, учёбой и всем остальным.'],
 [/что (ты )?умеешь|чем (ты )?(можешь )?помочь/,()=>'Я умею: писать и объяснять код 💻, помогать с учёбой 📚, придумывать лайфхаки 💡 и просто болтать 🎮. Спрашивай!'],
 [/спасибо|благодарю|сенкс/,()=>'Всегда пожалуйста! 😊 Обращайся ещё!'],
 [/^(пока|до свидания|до встречи|бывай)/,()=>'Пока! 👋 Возвращайся, Семён всегда на связи ⚡️'],
 [/лайфхак/,()=>'Лайфхак 💡: если надо что-то запомнить к утру — повтори это перед сном, а утром вспомни сразу после пробуждения. Мозг закрепляет информацию во сне!'],
 [/(анекдот|шутк)/,()=>'Программист ложится спать, ставит рядом два стакана: с водой — если захочет пить, и пустой — если не захочет 😄'],
 [/(как выучить|как учить|как лучше учить)/,()=>'Учиться лучше короткими подходами: 25 минут работы, 5 минут отдыха (метод Помодоро) 🍅 и обязательно пересказывай материал своими словами.'],
 [/(что такое )?html\b/,()=>'HTML — язык разметки страниц: он задаёт структуру (заголовки, текст, кнопки). Стили добавляет CSS, а логику — JavaScript 🧩'],
 [/что такое (css|стили)/,()=>'CSS — язык стилей: цвета, размеры, расположение, анимации. С ним сайт из голого текста превращается в красоту 🎨'],
 [/что такое (js|javascript|джаваскрипт)/,()=>'JavaScript — язык, который оживляет страницы: кнопки, анимации, запросы к серверу. Он работает прямо в браузере ⚡️'],
 [/(погода|курс доллара|новости)/,()=>'Этого я сейчас не вижу — у меня нет доступа к свежим данным 🛰 Но с кодом, учёбой и идеями помогу!'],
 [/(\-?\d+(?:[.,]\d+)?)\s*([+\-*\/x×:÷])\s*(\-?\d+(?:[.,]\d+)?)/,(t)=>{
   const m=t.match(/(\-?\d+(?:[.,]\d+)?)\s*([+\-*\/x×:÷])\s*(\-?\d+(?:[.,]\d+)?)/);
   const a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[3].replace(',','.')),o=m[2];
   let r=o==='+'?a+b:o==='-'?a-b:(o==='*'||o==='x'||o==='×')?a*b:b===0?null:a/b;
   return r===null?'На ноль делить нельзя 🙅':'Получится '+(+r.toFixed(6))+' 🧮';
 }]
];
function fallback(msgs){
  const last=msgs[msgs.length-1].t;
  const prev=(msgs[msgs.length-2]||{}).t||'';
  const n=last.toLowerCase().replace(/[^\p{L}\p{N}\s.,+\-*\/×÷:]/gu,'').trim();
  for(const [re,fn] of D){
    if(re.test(n)){const r=fn(n,prev);if(r)return r}
  }
  return 'Сейчас мой ИИ-мозг отдыхает (лимит запросов закончился) 🧢 Но я услышал тебя: «'+last.slice(0,80)+(last.length>80?'…':'')+'». Попробуй спросить ещё раз чуть позже или переформулируй вопрос!';
}

/* ---------- события ---------- */
$('#sd').onclick=send;
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
$('#bg').onclick=()=>menu(true);
$('#mx').onclick=()=>menu(false);
$('#nc').onclick=()=>{newChat();menu(false)};
$('#reg').onclick=()=>{$('#md').style.display='grid';setTimeout(()=>$('#ni').focus(),50)};
$('#mc').onclick=()=>{$('#md').style.display='none'};
$('#go').onclick=()=>{
  const v=$('#ni').value.trim();
  if(v.length<2){$('#ni').style.borderColor='#ff2d2d';return}
  nick=v;localStorage.sai_nick=nick;
  $('#md').style.display='none';
  showNick();showHello();save();sync();
};
$('#ni').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});

showNick();renderList();showHello();
if(window.FB)sync();
</script>
</body>
</html>
