<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 4px}
.burger{width:44px;height:44px;border:0;background:none;position:relative;cursor:pointer}
.burger i{position:absolute;left:10px;top:13px;width:24px;height:3px;background:#fff;border-radius:2px;box-shadow:0 8px 0 #fff,0 16px 0 #fff}
.main{flex:1;position:relative;min-height:0}
#chat{position:absolute;inset:0;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.u,.a{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.45;font-size:16px}
.u{align-self:flex-end;max-width:85%;background:#262626;padding:10px 14px;border-radius:18px 18px 4px 18px}
.a{align-self:flex-start;max-width:94%}
pre{background:#161616;padding:10px;border-radius:10px;overflow-x:auto;white-space:pre;margin:8px 0;font-size:13px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#1d1d1d;border-radius:5px;padding:1px 4px}
pre code{background:none;padding:0}
.ld{align-self:flex-start;font-size:30px;transition:opacity .6s}
.ld span{display:inline-block;animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#hello{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;pointer-events:none;font-size:30px;font-weight:800;overflow-wrap:anywhere}
#hello span{background:linear-gradient(90deg,#f33,#fa0,#ee0,#3d3,#0cf,#66f,#f3f,#f33);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rb 4s linear infinite}
@keyframes rb{to{background-position:300% 0}}
.bar{display:flex;gap:10px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar input{flex:1;min-width:0;height:48px;border:0;border-radius:24px;background:#ff2d2d;color:#000;padding:0 18px;font-size:16px;outline:0;text-overflow:ellipsis;white-space:nowrap}
.bar input::placeholder{color:#000;opacity:1}
.send{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:#ff2d2d;position:relative;cursor:pointer}
.send::before{content:"";position:absolute;left:50%;top:13px;width:3px;height:21px;margin-left:-1.5px;background:#000;border-radius:2px}
.send::after{content:"";position:absolute;left:50%;top:15px;width:12px;height:12px;margin-left:-6px;border-left:3px solid #000;border-top:3px solid #000;transform:rotate(45deg)}
#menu{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
#menu.on{transform:none;visibility:visible}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
.x{width:44px;height:44px;border-radius:50%;background:#ff2d2d;color:#000;border:0;font:700 22px/1 sans-serif;cursor:pointer}
.nc{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;font-size:17px;font-weight:600;padding:8px 4px;cursor:pointer}
.pad{width:18px;height:22px;border:2px solid #fff;border-radius:3px;position:relative;background:repeating-linear-gradient(#000 0 4px,#fff 4px 5px);background-size:100% 100%;background-position:0 5px;background-repeat:no-repeat}
.pad::before{content:"";position:absolute;left:2px;right:2px;top:-5px;height:5px;border-left:2px solid #fff;border-right:2px solid #fff}
.list{flex:1;overflow-y:auto;padding:6px 14px}
.it{padding:13px 14px;border-radius:12px;background:#151515;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.it.cur{outline:1px solid #ff2d2d}
.bot{padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center}
#reg{background:#1e6bff;color:#fff;border:0;border-radius:14px;padding:15px 28px;font-size:17px;font-weight:700;cursor:pointer}
#nick{display:none;align-items:center;gap:10px;font-size:18px;font-weight:600;overflow-wrap:anywhere}
#nick b{width:36px;height:36px;border-radius:50%;background:#1e6bff;display:grid;place-items:center;flex:none}
#md,#ed{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none;place-items:center}
.box{position:relative;width:min(88vw,340px);background:#1c1c1c;border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.box h3{margin:6px 34px 0;text-align:center;font-size:18px;color:#fff}
.box input{width:100%;height:46px;border-radius:12px;border:1px solid #444;background:#000;color:#fff;font-size:16px;text-align:center;outline:0}
.cl{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:#333;color:#fff;font:400 20px/1 sans-serif;cursor:pointer}
.go{width:100%;height:46px;border:0;border-radius:12px;background:#ff9500;color:#000;font-size:17px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6}
.eb{display:block;margin-top:10px;background:#262626;color:#ff9a9a;border:1px solid #444;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
#et{white-space:pre-wrap;overflow-wrap:anywhere;max-height:45vh;overflow:auto;width:100%;margin:0;color:#ff9a9a;user-select:text;-webkit-user-select:text}
.er{min-height:18px;margin:0;font-size:13px;color:#ff6b6b;text-align:center;overflow-wrap:anywhere}
.sw{background:none;border:0;color:#8ab4ff;font-size:14px;cursor:pointer}
.lo{background:none;border:1px solid #444;border-radius:10px;color:#aaa;font-size:14px;padding:6px 10px;cursor:pointer}
#off{position:fixed;inset:0;z-index:30;background:#000;display:none;align-items:center;justify-content:center;padding:20px}
#off.on{display:flex}
.oc{text-align:center;display:flex;flex-direction:column;align-items:center}
.oc svg{width:min(62vw,260px);height:auto}
.oc h2{margin:18px 0 6px;font-size:24px;font-weight:700;color:#fff}
.oc p{margin:0 0 22px;color:#aaa;font-size:16px}
#rt{background:#ff2d2d;color:#000;border:0;border-radius:24px;padding:13px 38px;font-size:17px;font-weight:700;cursor:pointer}
#rt:disabled{opacity:.6}
@keyframes wb{0%,100%{opacity:.25}50%{opacity:1}}
.wa1{animation:wb 1.8s infinite}.wa2{animation:wb 1.8s .3s infinite}.wa3{animation:wb 1.8s .6s infinite}
</style>
</head>

      </g>
      <circle cx="130" cy="74" r="4" fill="#777"/>
      <line x1="90" y1="20" x2="170" y2="90" stroke="#000" stroke-width="12" stroke-linecap="round"/>

      <rect x="46" y="192" width="14" height="32" rx="5" fill="#ff2d2d"/>

      <path d="M68 162 C68 105 192 105 192 162 Z" fill="#ff2d2d"/>
      <ellipse cx="202" cy="166" rx="34" ry="7" fill="#c41e1e"/>

      <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="91" y1="195" x2="109" y2="213"/><line x1="109" y1="195" x2="91" y2="213"/>
        <line x1="151" y1="195" x2="169" y2="213"/><line x1="169" y1="195" x2="151" y2="213"/>

<script>
const $=s=>document.querySelector(s);
const ICON='https://i.ibb.co/bjffzTRt/icon-glass-1024.png';
// Ключ разделён на 3 части, склеивается браузером в момент запроса
const k1='AQ.Ab8RN6LGJNLOy72C',k2='TIkT-kF_Eu1Hwq1Q_e',k3='XQpIkUQ0OA1vKmNg';
// Адрес Gemini для модели m. Если из твоей страны API закрыт — подставь адрес своего прокси:
// const GEMINI_URL=m=>'https://твой-проект.vercel.app/api/gemini?model='+m;
const GEMINI_URL=m=>'https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent';
// Если модель перегружена (503), закончилась квота (429) или недоступна — автоматически берётся следующая
const MODELS=['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash'];
const bad={};
const SYS='Ты Семён AI — помогаешь с кодом, делами, лайфхаками, учёбой и всем остальным. Внимательно читай вопрос пользователя и отвечай именно на него, по делу, на языке пользователя. Помни контекст переписки.';

let chats={},cur=null,uid=localStorage.sai_uid||'',nick=uid?(localStorage.sai_nick||''):'',busy=false,tm;
try{chats=JSON.parse(localStorage.sai_chats||'{}')}catch(e){}
const chat=$('#chat');

/* PWA manifest */
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify({name:'Семён AI',short_name:'Семён AI',start_url:'.',display:'standalone',background_color:'#000000',theme_color:'#000000',icons:[{src:ICON,sizes:'192x192 512x512 1024x1024',type:'image/png',purpose:'any'}]})],{type:'application/manifest+json'}));

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
  s=esc(s);
  s=s.replace(/```\w*\n?([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c+'</code></pre>');
  return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
}
const scroll=()=>{chat.scrollTop=chat.scrollHeight};

/* ---------- облако ---------- */
const fkey=()=>uid;
function save(){
  const data=JSON.stringify(chats);
  localStorage.sai_chats=data;
  if(uid&&window.FB)FB.save(fkey(),{data,t:Date.now()}).catch(()=>{});
}
async function sync(){
  if(!uid||!window.FB)return;
  try{
    const v=await FB.load(fkey());
    if(v&&v.data){
      const r=JSON.parse(v.data);
      for(const id in r){if(!chats[id]||(r[id].t||0)>(chats[id].t||0))chats[id]=r[id]}
      localStorage.sai_chats=JSON.stringify(chats);
      renderList();
      if(cur&&chats[cur]&&!busy)openChat(cur);
    }
    save();
  }catch(e){}
}
let lu='';
function listen(){
  if(!uid||!window.FB||lu===uid)return;
  const me=lu=uid;
  FB.listen(uid,v=>{
    if(lu!==me||!v||!v.data||busy)return;
    try{
      const r=JSON.parse(v.data);let ch=false;
      for(const id in r){if(!chats[id]||(r[id].t||0)>(chats[id].t||0)){chats[id]=r[id];ch=true}}
      if(!ch)return;
      localStorage.sai_chats=JSON.stringify(chats);renderList();
      if(cur&&chats[cur])openChat(cur);
    }catch(e){}
  });
}
function setUser(u){
  uid=u.uid;nick=u.displayName||(u.email||'').split('@')[0];
  localStorage.sai_uid=uid;localStorage.sai_nick=nick;
  showNick();showHello();sync();listen();
}
function clearUser(){
  lu='';uid='';nick='';chats={};cur=null;
  ['sai_uid','sai_nick','sai_chats'].forEach(k=>localStorage.removeItem(k));
  chat.innerHTML='';showNick();renderList();showHello();menu(false);
}
let authOn=false;
function initAuth(){
  if(authOn||!window.FB)return;authOn=true;
  FB.onUser(u=>{if(u)setUser(u);else if(uid)clearUser()});
}
window.addEventListener('fb',initAuth);

/* ---------- интерфейс ---------- */
function showHello(){
  const empty=!cur||!chats[cur]||!chats[cur].m.length;
  $('#hello').style.display=(empty&&nick)?'grid':'none';
  $('#hs').textContent='Здравствуйте, '+nick+'!';
}
function addErr(d,e){
  if(!e)return;
  const b=document.createElement('button');b.className='eb';b.textContent='Просмотреть код ошибки';
  b.onclick=()=>{$('#et').textContent=e;$('#ed').style.display='grid'};
  d.appendChild(b);
}
function bubble(role,text,type,err){
  const d=document.createElement('div');
  d.className=role==='user'?'u':'a';
  chat.appendChild(d);
  if(role==='user'){d.textContent=text;scroll();return Promise.resolve()}
  if(!type){d.innerHTML=md(text);addErr(d,err);scroll();return Promise.resolve()}
  return new Promise(res=>{
    let i=0;const st=Math.max(1,Math.ceil(text.length/350));
    clearInterval(tm);
    tm=setInterval(()=>{
      i+=st;d.textContent=text.slice(0,i);scroll();
      if(i>=text.length){clearInterval(tm);d.innerHTML=md(text);addErr(d,err);scroll();res()}
    },18);
  });
}
function loader(){
  const d=document.createElement('div');d.className='ld';d.innerHTML='<span>⚡️</span>';
  chat.appendChild(d);
  const E=['⚡️','🧢','🎮'];let n=0;
  d.t=setInterval(()=>{
    d.style.opacity=0;
    setTimeout(()=>{n=(n+1)%3;d.firstChild.textContent=E[n];d.style.opacity=1},600);
  },6000);
  scroll();return d;
}
function openChat(id){
  clearInterval(tm);cur=id;chat.innerHTML='';
  chats[id].m.forEach(m=>bubble(m.r==='user'?'user':'bot',m.t,false,m.e));
  showHello();renderList();
}
function newChat(){clearInterval(tm);cur=null;chat.innerHTML='';showHello();renderList()}
function renderList(){
  const l=$('#list');l.innerHTML='';
  Object.values(chats).sort((a,b)=>(b.t||0)-(a.t||0)).forEach(c=>{
    const d=document.createElement('div');d.className='it'+(c.id===cur?' cur':'');
    d.textContent=c.title;
    d.onclick=()=>{openChat(c.id);menu(false)};
    l.appendChild(d);
  });
}
const menu=on=>$('#menu').classList.toggle('on',on);
function showNick(){
  if(!nick){$('#reg').style.display='';$('#nick').style.display='none';return}
  $('#reg').style.display='none';$('#nick').style.display='flex';
  $('#nm').textContent=nick;$('#av').textContent=nick[0].toUpperCase();
}

/* ---------- отправка ---------- */
async function send(){
  const inp=$('#in'),text=inp.value.trim();
  if(!text||busy)return;
  if(!navigator.onLine){pend=true;showOff();return}
  inp.value='';busy=true;
  if(!cur||!chats[cur]){
    cur='c'+Date.now();
    chats[cur]={id:cur,title:text.slice(0,40),m:[],t:Date.now()};
  }
  const id=cur,c=chats[id];
  c.m.push({r:'user',t:text});c.t=Date.now();save();renderList();showHello();
  bubble('user',text);
  const ld=loader();
  const ans=await ask(c.m);
  clearInterval(ld.t);ld.remove();
  c.m.push(ans.e?{r:'bot',t:ans.t,e:ans.e,x:ans.x}:{r:'bot',t:ans.t});c.t=Date.now();save();
  if(ans.e&&/сеть\/таймаут/.test(ans.e))checkNet().then(ok=>{if(!ok)showOff()});
  if(cur===id)await bubble('bot',ans.t,true,ans.e);
  busy=false;
}

async function ask(msgs){
  // Основной ответ — Gemini. Модель не ответила → пробуем следующую. Словарь — только когда не ответила ни одна.
  const log=[];
  for(let pass=0;pass<2;pass++){
    const now=Date.now();
    let list=MODELS.filter(x=>!(bad[x]&&now-bad[x]<60000));
    if(!list.length)list=MODELS;
    let stop=false;
    for(const model of list){
      try{
        const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);
        const r=await fetch(GEMINI_URL(model),{
          method:'POST',signal:ac.signal,
          headers:{'Content-Type':'application/json','X-goog-api-key':k1+k2+k3},
          body:JSON.stringify({
            systemInstruction:{parts:[{text:SYS}]},
            contents:msgs.filter(m=>!m.x).map(m=>({role:m.r==='user'?'user':'model',parts:[{text:m.t}]}))
          })
        });
        clearTimeout(to);
        if(!r.ok){
          const st=r.status;let msg='',sn='';
          try{const j=await r.json();msg=j.error.message||'';sn=j.error.status||''}catch(e){}
          const line=model+' → HTTP '+st+(sn?' ('+sn+')':'')+(msg?': '+msg:'');
          log.push(line);console.warn('Gemini',line);
          // ключ неверный или регион закрыт — другие модели не помогут
          if(st===401||st===403||(st===400&&/location/i.test(msg))){stop=true;break}
          bad[model]=Date.now();
          continue;
        }
        const j=await r.json();
        const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
        if(t){delete bad[model];return {t}}
        log.push(model+' → пустой ответ');bad[model]=Date.now();
      }catch(e){
        log.push(model+' → сеть/таймаут: '+((e&&e.message)||e));bad[model]=Date.now();
      }
    }
    if(stop)break;
    await new Promise(r=>setTimeout(r,1500));
  }
  const f=fallback(msgs);
  return {t:f||'Ответ не получен ⚠️',e:log.slice(-8).join('\n\n')||'Неизвестная ошибка',x:!f};
}

 [/(\-?\d+(?:[.,]\d+)?)\s*([+\-*\/x×:÷])\s*(\-?\d+(?:[.,]\d+)?)/,(t)=>{
   const m=t.match(/(\-?\d+(?:[.,]\d+)?)\s*([+\-*\/x×:÷])\s*(\-?\d+(?:[.,]\d+)?)/);
   const a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[3].replace(',','.')),o=m[2];
   let r=o==='+'?a+b:o==='-'?a-b:(o==='*'||o==='x'||o==='×')?a*b:b===0?null:a/b;
   return r===null?'На ноль делить нельзя 🙅':'Получится '+(+r.toFixed(6))+' 🧮';
 }]
];
function fallback(msgs){
  const last=msgs[msgs.length-1].t;
  const prev=(msgs[msgs.length-2]||{}).t||'';
  const n=last.toLowerCase().replace(/[^\p{L}\p{N}\s.,+\-*\/×÷:]/gu,'').trim();
  for(const [re,fn] of D){
    if(re.test(n)){const r=fn(n,prev);if(r)return r}
  }
  return null;
}

const off=$('#off');let pend=false;
function showOff(){off.classList.add('on')}
function ping(u){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),5000);
  return fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{mode:'no-cors',cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(t));
}
async function checkNet(){
  if(!navigator.onLine)return false;
  try{
    await Promise.any([
      ping('https://www.gstatic.com/generate_204'),
      ping('https://www.cloudflare.com/cdn-cgi/trace'),
      ping('https://www.apple.com/library/test/success.html')
    ]);
    return true;
  }catch(e){return false}
}
async function recheck(){
  const b=$('#rt');b.disabled=true;b.textContent='Проверяю…';
  const ok=await checkNet();
  b.disabled=false;b.textContent='Повторить';
  if(ok){off.classList.remove('on');if(pend){pend=false;send()}}
}
$('#rt').onclick=recheck;
window.addEventListener('offline',showOff);
window.addEventListener('online',()=>{if(off.classList.contains('on'))recheck()});
if(!navigator.onLine)showOff();
