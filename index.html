<script>

const ICON='https://i.ibb.co/bjffzTRt/icon-glass-1024.png';
// Ключ разделён на 3 части, склеивается браузером в момент запроса

// Если модель перегружена (503), закончилась квота (429) или недоступна — автоматически берётся следующая

try{chats=JSON.parse(localStorage.sai_chats||'{}')}catch(e){}

try{mem=JSON.parse(localStorage.sai_mem||'[]')}catch(e){}

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
  s=esc(s);
  s=s.replace(/```\w*\n?([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c+'</code></pre>');
  return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
}

/* ---------- облако ---------- */
const fkey=()=>uid;
function save(){
  const data=JSON.stringify(chats);
  try{localStorage.sai_chats=data}catch(e){}
  if(uid&&window.FB)FB.save(fkey(),{data,t:Date.now(),mem:JSON.stringify(mem)}).catch(()=>{});
}
async function sync(){
  if(!uid||!window.FB)return;
  try{
    const v=await FB.load(fkey());
    if(v&&v.mem)mergeMem(v.mem);
    if(v&&v.data){
      const r=JSON.parse(v.data);
      for(const id in r){if(!chats[id]||(r[id].t||0)>(chats[id].t||0))chats[id]=r[id]}
      localStorage.sai_chats=JSON.stringify(chats);

    if(lu!==me||!v)return;

      const r=JSON.parse(v.data);let ch=false;

      if(!ch)return;
      localStorage.sai_chats=JSON.stringify(chats);renderList();

    }catch(e){}

}

function toContents(msgs){
  const h=msgs.filter(m=>!m.x),keep=new Set();let left=3;
  for(let i=h.length-1;i>=0&&left>0;i--)if(h[i].i){keep.add(i);left--}
  return h.map((m,i)=>{
    const parts=[];
    if(keep.has(i))parts.push({inlineData:{mimeType:'image/jpeg',data:m.i.split(',')[1]}});
    if(m.t)parts.push({text:m.t});
    if(!parts.length)parts.push({text:'(фото)'});
    return {role:m.r==='user'?'user':'model',parts};
  });
}
async function ask(msgs){
  const contents=toContents(msgs);
  // Основной ответ — Gemini. Модель не ответила → пробуем следующую. Словарь — только когда не ответила ни одна.
  const log=[];
  for(let pass=0;pass<2;pass++){
    const now=Date.now();
    let list=MODELS.filter(x=>!(bad[x]&&now-bad[x]<60000));
    if(!list.length)list=MODELS;
    let stop=false;
    for(const model of list){
      try{
        const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);
        const r=await fetch(GEMINI_URL(model),{
          method:'POST',signal:ac.signal,
          headers:HDR,
          body:JSON.stringify({
            systemInstruction:{parts:[{text:SYS+memBlock()}]},
            contents
          })
        });
        clearTimeout(to);
        if(!r.ok){
          const st=r.status;let msg='',sn='';
          try{const j=await r.json();msg=j.error.message||'';sn=j.error.status||''}catch(e){}
          const line=model+' → HTTP '+st+(sn?' ('+sn+')':'')+(msg?': '+msg:'');
          log.push(line);console.warn('Gemini',line);
          // ключ неверный или регион закрыт — другие модели не помогут
          if(st===401||st===403||(st===400&&/location/i.test(msg))){stop=true;break}
          bad[model]=Date.now();
          continue;
        }
        const j=await r.json();
        const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
        if(t){delete bad[model];return {t}}
        log.push(model+' → пустой ответ');bad[model]=Date.now();
      }catch(e){
        log.push(model+' → сеть/таймаут: '+((e&&e.message)||e));bad[model]=Date.now();
      }
    }
    if(stop)break;
    await new Promise(r=>setTimeout(r,1500));
  }
  const f=msgs[msgs.length-1].i?null:fallback(msgs);
  return {t:f||'Ответ не получен ⚠️',e:log.slice(-8).join('\n\n')||'Неизвестная ошибка',x:!f};
}

async function gem(prompt){
  const now=Date.now();
  let list=MODELS.filter(x=>!(bad[x]&&now-bad[x]<60000));
  if(!list.length)list=MODELS;
  for(const model of list){
    try{

// Автосохранение: описание проекта/сервиса/идеи запоминается целиком, повторное упоминание дополняет запись
async function learn(text){
  if(text.length<30)return;
  const have=memAct().map(x=>'- '+x.k+': '+x.t).join('\n').slice(0,6000)||'(пусто)';
  const pr='Ты модуль памяти ассистента Семён AI.\n\nУже сохранённая память:\n'+have+'\n\nНовое сообщение пользователя:\n«'+text+'»\n\nЕсли в сообщении пользователь описывает что-то, что стоит запомнить надолго (свой проект, сервис, приложение, игру, идею, планы, предпочтения, факты о себе), верни JSON {"items":[{"k":"короткое название","t":"полное описание"}]}. Описание сохраняй ПОЛНОСТЬЮ, со всеми деталями и словами пользователя, ничего не выдумывай. Если это про то, что уже есть в памяти (то же название или тема), верни тот же k и объединённое полное описание (старые детали + новые). Если запоминать нечего (обычный вопрос, просьба, приветствие, болтовня) — верни {"items":[]}. Только JSON.';
  let items=null;
  const out=await gem(pr);
  if(out){
    try{
      const j=JSON.parse(out.replace(/^```\w*\s*|\s*```$/g,''));
      if(Array.isArray(j.items))items=j.items;
    }catch(e){}
  }
  // ИИ недоступен — длинное описание сохраняем как есть
  if(items===null&&text.length>=80)items=[{k:text.slice(0,40),t:text}];
  if(!items||!items.length)return;
  let ch=false;
  items.forEach(x=>{if(x&&putMem(x.k,x.t))ch=true});
  if(ch){memSave();toast('Сохранено в память 🧠')}
}

function fallback(msgs){
  const last=msgs[msgs.length-1].t;

  for(const [re,fn] of D){

  }
  return null;
}

function readImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const M=800,k=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72));
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej()};
    im.src=u;
  });
}

  'auth/too-many-requests':'Слишком много попыток, подожди немного',
  'auth/network-request-failed':'Нет интернета',
  'auth/operation-not-allowed':'В Firebase не включён вход по почте и паролю (Authentication → Sign-in method → Email/Password)'
};
$('#reg').onclick=()=>{setMode('in');$('#md').style.display='grid';setTimeout(()=>$('#em').focus(),50)};
$('#mc').onclick=()=>{$('#md').style.display='none'};
$('#ec').onclick=()=>{$('#ed').style.display='none'};
$('#ecp').onclick=()=>{
  const t=$('#et').textContent;
  try{navigator.clipboard.writeText(t).then(()=>{$('#ecp').textContent='Скопировано ✓';setTimeout(()=>$('#ecp').textContent='Копировать',1500)})}catch(e){}
};
$('#sw').onclick=()=>{location.href=ACCOUNT_URL};
$('#go').onclick=async()=>{
  const e=$('#em').value.trim(),p=$('#pw').value,er=$('#er');
  if(e.length<3){er.textContent='Введите ник';return}
  if(p.length<6){er.textContent='Пароль минимум 6 символов';return}
  if(!window.FB){er.textContent='Нет связи с Firebase. Проверь интернет и обнови страницу';return}
  $('#go').disabled=true;er.textContent='';
  try{
    await (mode==='up'?FB.signUp(e,p):FB.signIn(e,p));
    $('#md').style.display='none';$('#pw').value='';
  }catch(x){er.textContent=ERR[x.code]||('Ошибка: '+(x.code||x.message))}
  $('#go').disabled=false;
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#em').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pw').focus()});
$('#lo').onclick=()=>{if(window.FB)FB.signOut().catch(()=>{})};

showNick();renderList();showHello();
/* ---------- проверка сети ---------- */
const off=$('#off');let pend=false;
function showOff(){off.classList.add('on')}
function ping(u){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),5000);
  return fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{mode:'no-cors',cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(t));
}
async function checkNet(){
  if(!navigator.onLine)return false;
  try{
    await Promise.any([
      ping('https://www.gstatic.com/generate_204'),
      ping('https://www.cloudflare.com/cdn-cgi/trace'),
      ping('https://www.apple.com/library/test/success.html')
    ]);
    return true;
  }catch(e){return false}
}
async function recheck(){
  const b=$('#rt');b.disabled=true;b.textContent='Проверяю…';
  const ok=await checkNet();
  b.disabled=false;b.textContent='Повторить';
  if(ok){off.classList.remove('on');if(pend){pend=false;send()}}
}
$('#rt').onclick=recheck;
window.addEventListener('offline',showOff);
window.addEventListener('online',()=>{if(off.classList.contains('on'))recheck()});
if(!navigator.onLine)showOff();

initAuth();
</script>
